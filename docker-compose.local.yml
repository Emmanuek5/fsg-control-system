# Local-only overrides: publish ports on the host so you can hit services
# from the browser / Prisma Studio / pnpm dev.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#   pnpm docker:up
#   pnpm db:up

services:
  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  api:
    ports:
      - "${API_PORT:-4000}:4000"

  web:
    ports:
      - "${WEB_PORT:-3000}:3000"
