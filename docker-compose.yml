services:
  postgres:
    image: postgres:16-alpine
    container_name: fsg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fsg
      POSTGRES_PASSWORD: fsg_password
      POSTGRES_DB: fsg_control
    ports:
      - "5432:5432"
    volumes:
      - fsg_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsg -d fsg_control"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fsg_pgdata:
