# Full stack: Postgres + Nest API + Next.js web
#
# Coolify / production: use this file as-is.
# No host ports are published — services talk on the compose project network.
# Coolify (or any reverse proxy) routes public domains to container ports.
#
# NOTE: deliberately NO custom `networks:` here. Coolify attaches every service
# to its per-app network (the only one Traefik can reach); a second custom
# network makes Traefik guess which container IP to dial and it randomly picks
# the unreachable one → intermittent 504 Gateway Timeout after deploys.
#
# Local full stack (publish 3000 / 4000 / 5432 on the host):
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#   # or: pnpm docker:up
#
# Local DB only (pnpm dev on the host):
#   pnpm db:up

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fsg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fsg_password}
      POSTGRES_DB: ${POSTGRES_DB:-fsg_control}
    # Internal only — not published to the host. Reachable as hostname `postgres`
    # on the compose network (api → postgres:5432).
    expose:
      - "5432"
    volumes:
      - fsg_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fsg} -d ${POSTGRES_DB:-fsg_control}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # Container-internal listen port (Coolify proxies to this)
      PORT: 4000
      # Always use the compose service hostname so a host-side DATABASE_URL
      # (localhost) in .env does not break the container network.
      DATABASE_URL: postgresql://${POSTGRES_USER:-fsg}:${POSTGRES_PASSWORD:-fsg_password}@postgres:5432/${POSTGRES_DB:-fsg_control}?schema=public
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      UPLOAD_DIR: ${UPLOAD_DIR:-uploads}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_change_me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_change_me}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      # true when the site is served over HTTPS (Coolify / production)
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # set true once to load roles/users/sample data, then turn off
      SEED_ON_START: ${SEED_ON_START:-false}
      # Monnify (optional)
      MONNIFY_BASE_URL: ${MONNIFY_BASE_URL:-https://sandbox.monnify.com}
      MONNIFY_API_KEY: ${MONNIFY_API_KEY:-}
      MONNIFY_SECRET_KEY: ${MONNIFY_SECRET_KEY:-}
      MONNIFY_CONTRACT_CODE: ${MONNIFY_CONTRACT_CODE:-}
      MONNIFY_WALLET_ACCOUNT_NUMBER: ${MONNIFY_WALLET_ACCOUNT_NUMBER:-}
      MONNIFY_WEBHOOK_SECRET: ${MONNIFY_WEBHOOK_SECRET:-}
      MONNIFY_ENV: ${MONNIFY_ENV:-sandbox}
      MONNIFY_BILLS_ENABLED: ${MONNIFY_BILLS_ENABLED:-false}
    # Internal only — Coolify proxies to container port 4000
    expose:
      - "4000"
    volumes:
      - api_uploads:/app/apps/api/uploads
    # Also defined in Dockerfile; kept here so compose shows status clearly.
    # start_period covers migrate + cold Nest boot.
    healthcheck:
      test: ["CMD", "node", "/app/apps/api/healthcheck.js"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the client bundle — must be the URL browsers use to reach the API
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    restart: unless-stopped
    depends_on:
      api:
        # Don't block web forever if API health is slow; API still restarts on failure
        condition: service_started
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      HOSTNAME: 0.0.0.0
    # Internal only — Coolify proxies to container port 3000
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/',(r)=>{r.resume();process.exit(r.statusCode&&r.statusCode<500?0:1)}).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

volumes:
  fsg_pgdata:
  api_uploads:
